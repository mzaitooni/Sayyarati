function timelinePage(){let list=timelineItems();return `<div class="row sectionhead" style="margin-top:0"><h2>التايملاين</h2>${button('تحديث العداد','pickOdo()','secondary mini')}</div><p class="muted" style="margin:0 0 12px">الاستحقاقات القادمة لجميع السيارات، من الأقرب إلى الأبعد.</p>${list.length?`<div class="timeline">${list.map(x=>{let d=days(x.date),label=x.estimated?(d<0?'التقدير مضى':d===0?'اليوم تقريبًا':`بعد ${fmt(d)} يوم تقريبًا`):(d<0?`مضى ${fmt(-d)} يوم`:d===0?'اليوم':`بعد ${fmt(d)} يوم`);return `<div class="timeline-entry"><div class="timeline-date"><b>${dtext(x.date)}</b>${x.estimated?pill('تقديري','warn'):''}</div><button class="card timeline-card" onclick="${x.task?`editTask('${x.task.id}')`:`editRecord('${x.c.id}','${x.k}')`}"><span class="ico">${icon(x.task?'task':types[x.k][1])}</span><span class="grow"><small class="timeline-car-name"><span class="brandmark brandmini">${brandLogo(x.c)}</span><span>${e(x.c.name)}</span></small><b>${e(x.title)}</b><small>${e(x.detail)}</small></span><span class="timeline-end">${pill(label,x.estimated?'warn':d<=0?'bad':d<=data.settings.days?'warn':'good')}${icon('chev')}</span></button></div>`}).join('')}</div>`:'<div class="card empty">لا توجد استحقاقات محددة بعد. أضف تاريخًا أو مسافة للصيانة من الرئيسية.</div>'}<p class="muted timeline-note">التقدير الزمني للصيانة والكفرات والبطارية فقط: حسب العداد ومعدل القيادة أو فترة الفحص من آخر تركيب. الأعمال الإضافية تظهر عند تسجيل موعد لها أو ربطها بالصيانة القادمة؛ ويتحدث موعد العمل المرتبط تلقائيًا مع تقدير الصيانة.</p>`}

function modal(title,html){$('mt').textContent=title;$('mb').innerHTML=html;if(!$('modal').open)$('modal').showModal();$('modal').querySelector('.sheet').scrollTop=0}function closeModal(){$('modal').close()}function field(name,label,value='',type='text',extra=''){return `<label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" ${type==='number'?`inputmode="${['odo','lastOdo','nextOdo','remaining','leadKm','checkMonths','intervalKm','cycleMonths'].includes(name)?'numeric':'decimal'}"`: ''} value="${e(value)}" ${extra}>`}function area(name,label,value=''){return `<label for="f_${name}">${label}</label><textarea id="f_${name}" name="${name}">${e(value)}</textarea>`}function sel(name,label,value,opts){return `<label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${opts.map(([v,t])=>`<option value="${e(v)}" ${String(v)===String(value)?'selected':''}>${e(t)}</option>`).join('')}</select>`}function form(action,body,save='حفظ',extra=''){return `<form onsubmit="${action}">${body}<div class="actions"><button class="primary" type="submit">${save}</button>${extra}<button class="secondary" type="button" onclick="closeModal()">إلغاء</button></div></form>`}const vals=ev=>Object.fromEntries(new FormData(ev.target).entries());function editCar(id){let c=getCar(id)||{name:'',plate:'',model:''};modal(id?'تعديل السيارة':'إضافة سيارة',form(`saveCar(event,'${id||''}')`,field('name','اسم السيارة',c.name,'text','required maxlength="50"')+field('model','الموديل / السنة (اختياري)',c.model)+field('plate','اللوحة (اختياري)',c.plate),'حفظ',id?`<button type="button" class="danger" onclick="deleteCar('${id}')">حذف السيارة</button>`:''))}function saveCar(ev,id){ev.preventDefault();let v=vals(ev);if(!v.name.trim())return;let newId=id||uid();if(change(d=>{if(id)Object.assign(d.cars.find(c=>c.id===id),v);else d.cars.push({...car(newId,v.name),...v})})){closeModal();go('cars',newId)}}function deleteCar(id){let c=getCar(id);if(!c)return;modal('حذف &v>current)c.estimatedDailyKm=String(Math.round((v-current)/elapsed*10)/10);const pending=c.service.nextOdo===''&&n(c.service.remaining)!==null?remaining(c,'service',date):null;c.odo=String(v);c.odoDate=date;if(pending!==null){c.service.nextOdo=String(Math.max(0,v+pending));c.service.remaining=''}return true}function saveOdo(ev,id){ev.preventDefault();const v=vals(ev),c=getCar(id);if(!c)return;if(v.odoDate>today()||(c.odoDate&&v.odoDate<c.odoDate)){toast('اختر تاريخ قراءة حديثًا لا يتجاوز اليوم');return}if(n(v.odo)===null||!Number.isInteger(Number(v.odo))||Number(v.odo)<0){toast('أدخل قراءة عداد صحيحة');return}if(n(c.odo)!==null&&Number(v.odo)<Number(c.odo)){const f=ev.target;f.querySelector('#odoCorrection')?.remove();const panel=document.createElement('div');panel.id='odoCorrection';panel.className='notice';panel.innerHTML=`<b>تصحيح قراءة العداد</b><p>القراءة الجديدة (${fmt(v.odo)} كم) أقل من القراءة المسجلة (${fmt(c.odo)} كم). إذا كانت القراءة السابقة خاطئة، يمكنك اعتماد القراءة الجديدة.</p><div class="actions"><button type="button" class="primary" id="approveOdoCorrection">تأكيد التصحيح والحفظ</button><button type="button" class="secondary" id="cancelOdoCorrection">رجوع</button></div>`;f.querySelector('.actions').before(panel);const clear=()=>panel.remove();f.addEventListener('input',clear,{once:true});panel.querySelector('#cancelOdoCorrection').onclick=clear;panel.querySelector('#approveOdoCorrection').onclick=()=>{const current=vals({target:f});if(JSON.stringify(current)!==JSON.stringify(v)){clear();return;}commitOdo(id,v,true)};panel.scrollIntoView({block:'nearest',behavior:'smooth'});return}commitOdo(id,v,false)}
function commitOdo(id,v,correction){let applied=false;const c=getCar(id);if(!c||!v.odoDate||v.odoDate>today()||(c.odoDate&&v.odoDate<c.odoDate)){toast('اختر تاريخ قراءة حديثًا لا يتجاوز اليوم');return}if(n(c.odo)!==null&&Number(v.odo)<Number(c.odo)&&!correction)return;if(change(d=>{const c=d.cars.find(x=>x.id===id);applied=applyActualOdo(c,v.odo,v.odoDate,{allowCorrection:correction});if(applied)c.dailyKm=v.dailyKm})&&applied){closeModal();toast(correction?'تم تصحيح العداد الفعلي':'تم تحديث العداد الفعلي')}else if(!applied)toast('تعذر تحديث القراءة؛ تحقق من البيانات')}
function freshRecord(c,k){let r=rec(car(c.id,c.name),k);r.last=today();if(k==='service')r.lastOdo=c.odoDate===today()?c.odo||'':'';if(['battery','tires'].includes(k))r.checkMonths=rec(c,k).checkMonths??'12';if(k==='battery')r.cycleMonths=rec(c,k).cycleMonths||'36';if(k==='service'||k==='tires'){r.intervalKm=rec(c,k).intervalKm||(k==='service'?'10000':'40000');if(c.odoDate===today()&&n(c.odo)!==null)r.nextOdo=String(Number(c.odo)+Number(r.intervalKm));}if(k==='tires')r.lastOdo=c.odoDate===today()?c.odo||'':'';return r}

function updateOdoFromRecord(c,v){return applyActualOdo(c,v.lastOdo,v.last)}
// Repair previously saved current service/tyre readings once, without replacing newer actual readings.
function reconcileSavedOdo(d){if(d.odoSyncRevision===1)return d;for(const c of d.cars){const candidates=['service','tires'].map(k=>c[k]).filter(r=>r&&r.last&&r.last<=today()&&n(r.lastOdo)!==null&&Number.isFinite(n(r.lastOdo))&&n(r.lastOdo)>=0).sort((a,b)=>a.last.localeCompare(b.last)||Number(a.lastOdo)-Number(b.lastOdo));for(const r of candidates){if((!c.odoDate||r.last>=c.odoDate)&&(n(c.odo)===null||n(r.lastOdo)>n(c.odo)))updateOdoFromRecord(c,r);}}d.odoSyncRevision=1;return d;}
function bindRecordForecast(c,k,r,isNew){const last=$('f_last'),odo=$('f_lastOdo'),next=$('f_nextOdo'),interval=$('f_intervalKm'),months=$('f_cycleMonths'),manualDate=$('f_nextDate'),out=$('recordForecast');function preview(){let v={...r,last:last.value};if(odo){v.lastOdo=odo.value;v.nextOdo=next.value;v.intervalKm=interval.value;if(next.value!=='')v.remaining='';}if(months)v.cycleMonths=months.value;if(manualDate)v.nextDate=manualDate.value;let tmp={...c,[k]:v};if(odo&&odo.value!==''&&last.value&&(isNew||odo.value!==String(r.lastOdo??'')||last.value!==r.last)){tmp={...tmp,service:{...tmp.service}};applyActualOdo(tmp,odo.value,last.value);}const ev=maintenanceEvent(tmp,k);out.hidden=!ev;if(ev){out.textContent=(k==='service'?'موعد الصيانة المتوقع: ':k==='tires'?'موعد تقييم الكفرات المتوقع: ':'موعد تقييم البطارية المتوقع: ')+dtext(ev.date)+' — '+ev.detail;}}function calculate(){if(odo&&interval){next.value=odo.value!==''&&Number(interval.value)>0?String(Number(odo.value)+Number(interval.value)):'';}preview();}if(odo){odo.addEventListener('input',calculate);interval.addEventListener('input',calculate);next.addEventListener('input',preview);}last.addEventListener('input',preview);if(months)months.addEventListener('input',preview);if(manualDate)manualDate.addEventListener('input',preview);if(isNew&&odo)calculate();else preview();}
async function saveRecord(ev,id,k,isNew=false){ev.preventDefault();let v=vals(ev),file=v.attachment,remove=v.removeFile;delete v.attachment;delete v.removeFile;let attachment=null;if(file&&file.size){if(file.size>1.5*1024*1024){toast('الملف أكبر من 1.5 ميجابايت');return}try{attachment=await readFile(file)}catch(e){toast('تعذر قراءة الملف');return}}if(isNew&&(!v.last||(getCar(id).docs[k]&&!v.expiry)||(['service','tires'].includes(k)&&(n(v.lastOdo)===null||n(v.nextOdo)===null)))){toast('أكمل البيانات الأساسية');return}if(['service','tires'].includes(k)&&v.last>today()){toast('تاريخ العملية لا يمكن أن يكون في المستقبل');return}if(isNew&&v.expiry&&v.expiry<v.last){toast('تاريخ الانتهاء لا يمكن أن يسبق تاريخ العملية');return}if(['service','tires'].includes(k)&&n(v.lastOdo)!==null&&n(v.nextOdo)!==null&&n(v.nextOdo)<=n(v.lastOdo)){toast('العداد القادم يجب أن يكون أكبر من العداد السابق');return}let synced=false;const before=rec(getCar(id),k);const shouldSync=['service','tires'].includes(k)&&n(v.lastOdo)!==null&&!!v.last&&(isNew||n(v.lastOdo)!==n(before.lastOdo)||v.last!==before.last);if(change(d=>{let c=d.cars.find(x=>x.id===id),r=rec(c,k);if(isNew){archivePrevious(c,k,r);let next=freshRecord(c,k);next.history=r.history;if(c.docs[k])c.docs[k]=next;else c[k]=next;r=next;}Object.assign(r,v);if(attachment)r.file=attachment;else if(remove)r.file=null;if(k==='service'&&r.nextOdo!=='')r.remaining='';if(shouldSync)synced=updateOdoFromRecord(c,v);if(k==='service'&&r.nextOdo===''&&r.remaining!==''&&c.odo!==''){r.nextOdo=String(Number(c.odo)+Number(r.remaining));r.remaining=''}if(isNew&&k==='service')r.estimateBase=r.last;})){if(isNew)editRecord(id,k);else closeModal();const c=getCar(id);toast(shouldSync?(synced?'تم حفظ العملية وتحديث العداد الفعلي':v.last<c.odoDate?'تم حفظ العملية؛ تاريخ القراءة أقدم من آخر قراءة فعلية':'تم حفظ العملية؛ القراءة أقل من العداد الفعلي، صححها من تحديث العداد'):isNew?'تم تسجيل الجديد وحفظ السجل السابق':'تم حفظ التعديل')}}function downloadBlob(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function downloadAttachment(f){if(!f||!/^data:(image\/[^;,]+|application\/pdf|application\/octet-stream);base64,/i.test(f.data)){toast('المرفق غير متاح');return}let a=document.createElement('a');a.href=f.data;a.download=f.name;document.body.append(a);a.click();a.remove()}function downloadRecord(id,k){downloadAttachment(rec(getCar(id),k).file)}function historyItem(r,k,id,origin='record'){return `<div class="item"><div class="grow"><b>${r.last?dtext(r.last):'تاريخ العملية غير مسجل'}</b><br><small>${e(types[k][0])}${r.cost!==''&&r.cost!=null?' · '+e(r.cost)+' ريال':''}${r.lastOdo!==''&&r.lastOdo!=null?' · عداد '+fmt(r.lastOdo)+' كم':''}${r.nextOdo!==''&&r.nextOdo!=null?' · القادم '+fmt(r.nextOdo)+' كم':''}${r.expiry?' · انتهاء '+dtext(r.expiry):''}${r.company?' · '+e(r.company):''}${r.brand?' · '+e(r.brand):''}${r.kind?' · '+e(r.kind):''}</small>${r.work?`<p>${e(r.work)}</p>`:''}${r.notes?`<p class="muted">${e(r.notes)}</p>`:''}${r.file?`<button class="secondary mini" onclick="downloadHistory('${id}','${k}','${r.id}')">المرفق</button>`:''}</div><button class="danger mini" onclick="deleteHistory('${id}','${k}','${r.id}','${origin}')">حذف</button></div>`}function recordHistory(id,k){let c=getCar(id),r=rec(c,k);modal('سجل '+types[k][0]+' · '+c.name,r.history.map(x=>historyItem(x,k,id)).join('')||'<div class="empty">لا توجد عمليات مسجلة.</div>');$('mb').insertAdjacentHTML('beforeend',`<button class="secondary full" onclick="editRecord('${id}','${k}')">رجوع</button>`)}function downloadHistory(id,k,h){downloadAttachment(rec(getCar(id),k).history.find(x=>x.id===h)?.file)}function deleteHistory(id,k,h,origin='record'){const c=getCar(id),r=c&&rec(c,k),entry=r?.history.find(x=>x.id===h);if(!entry){toast('لم يتم العثور على العملية');return}modal('حذف عملية من السجل',`<div class="notice">هل تريد حذف <b>${e(types[k][0])}</b> من سجل ${e(c.name)}${entry.last?' بتاريخ '+dtext(entry.last):''}؟ سيتم حذف هذه العملية ومرفقها فقط، ولن تتغير البيانات الحالية أو العداد. لا يمكن التراجع عن الحذف.</div><div class="stack" style="margin-top:16px"><button type="button" class="danger full" onclick="confirmDeleteHistory('${id}','${k}','${h}','${origin}')">تأكيد الحذف</button><button type="button" class="secondary full" onclick="returnHistory('${id}','${k}','${origin}')">إلغاء</button></div>`)}
function returnHistory(id,k,origin){if(origin==='car')carHistory(id);else recordHistory(id,k)}
function confirmDeleteHistory(id,k,h,origin='record'){const c=getCar(id);if(!c||!rec(c,k).history.some(x=>x.id===h)){returnHistory(id,k,origin);return}if(change(d=>{const r=rec(d.cars.find(c=>c.id===id),k);r.history=r.history.filter(x=>x.id!==h)})){returnHistory(id,k,origin);toast('تم حذف العملية من السجل')}}function carHistory(id){let c=getCar(id),entries=Object.keys(types).flatMap(k=>rec(c,k).history.map(r=>({k,r}))).sort((a,b)=>(b.r.last||b.r.saved).localeCompare(a.r.last||a.r.saved));modal('سجل '+c.name,(entries.map(x=>historyItem(x.r,x.k,id,'car')).join('')||'<div class="empty">لا توجد عمليات صيانة أو تجديد مسجلة.</div>')+`<h3 class="line">الأعمال المنجزة</h3>${data.tasks.filter(t=>t.carId===id&&t.status==='done').map(taskRow).join('')||'<div class="empty">لا توجد أعمال منجزة.</div>'}`)}
function quick(){if(!data.cars.length){editCar();return}modal('إضافة سريعة',`<div class="stack">${button('+ عمل أو إصلاح جديد',`editTask(null,'${page==='cars'?selected:''}')`,'primary full')}${button('تحديث قراءة العداد','pickOdo()','secondary full')}${button('تسجيل تجديد أو صيانة','pickRecord()','secondary full')}</div>`)}function pickOdo(){modal('اختر السيارة',data.cars.map(c=>`<button class="item" onclick="editOdo('${c.id}')">${icon('car')}<b class="grow">${e(c.name)}</b>${icon('chev')}</button>`).join(''))}function pickRecord(){modal('اختر السيارة',data.cars.map(c=>`<div class="card"><h3>${e(c.name)}</h3><div class="linkrow">${Object.keys(types).map(k=>button(types[k][0],`editRecord('${c.id}','${k}',true)`,'secondary mini')).join('')}</div></div>`).join(''))}function editTask(id,cid){if(!data.cars.length){editCar();return}let t=data.tasks.find(x=>x.id===id)||task(uid(),cid||((page==='cars'||filter==='all')?selected:filter)||data.cars[0].id,'','repair');if(!getCar(t.carId))t.carId=data.cars[0].id;let body=sel('carId','السيارة',t.carId,data.cars.map(c=>[c.id,c.name]))+field('title','العمل المطلوب',t.title,'text','required maxlength="150"')+`<label style="display:flex;align-items:center;gap:8px;margin-top:12px"><input id="f_linkService" type="checkbox" name="linkService" style="width:auto;min-height:0" ${t.linkService?'checked':''} onchange="syncTaskSchedule()"> مع الصيانة القادمة</label>`+field('due','موعد العمل (اختياري)',t.due,'date')+`<p id="taskScheduleHint" class="muted" style="margin:5px 0 0;font-size:12px" hidden></p><details class="extra"><summary>تفاصيل إضافية (اختياري)</summary>`+sel('category','نوع العمل',t.category,Object.entries(cats))+sel('priority','الأولوية',t.priority,[['normal','عادي / قابل للتأجيل'],['urgent','عاجل']])+sel('status','الحالة',t.status,Object.entries(statuses))+field('leadKm','التذكير بالتجهيز قبل الصيانة (كم)',t.leadKm,'number','min="0" step="1"')+sel('depends','بعد إنجاز عمل آخر',t.depends,[['','لا يوجد'],...data.tasks.filter(x=> old!=='done')t.doneDate=today();if(v.status!=='done')t.doneDate='';if(old==='done'&&v.status!=='done')d.tasks.filter(x=>x.depends===t.id&&x.status==='done').forEach(x=>{x.status='pending';x.doneDate=''})}else d.tasks.push({...task(newId,v.carId,v.title,v.category),...v,doneDate:v.status==='done'?today():''});d.tasks.filter(x=>x.depends===newId&&x.carId!==v.carId).forEach(x=>x.depends='')})){closeModal();toast('تم حفظ العمل')}}function toggleTask(id){let t=data.tasks.find(x=>x.id===id);if(!t)return;if(t.status!=='done'&&t.depends&&data.tasks.find(x=>x.id===t.depends)?.status!=='done'){toast('أنجز العمل السابق أولًا');return}if(t.status==='done'&&data.tasks.some(x=>x.depends===id&&x.status==='done')){toast('أعد فتح العمل التابع أولًا');return}change(d=>{let x=d.tasks.find(t=>t.id===id);x.status=x.status==='done'?'pending':'done';x.doneDate=x.status==='done'?today():''});if($('modal').open)closeModal()}function deleteTask(id){if(!confirm('حذف هذا العمل؟'))return;if(change(d=>{d.tasks=d.tasks.filter(t=>t.id!==id);d.tasks.forEach(t=>{if(t.depends===id)t.depends=''})}))closeModal()}function editGeneral(){modal('ملاحظات عامة',form('saveGeneral(event)',area('notes','ملاحظات غير مرتبطة بسيارة محددة',data.generalNotes)))}function saveGeneral(ev){ev.preventDefault();if(change(d=>d.generalNotes=vals(ev).notes))closeModal()}function saveSettings(ev){ev.preventDefault();let v=vals(ev);if(change(d=>d.settings={days:Number(v.days),km:Number(v.km)}))toast('تم حفظ الإعدادات')}function exportData(){downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'Sayyarati_'+today()+'.json')}function validate(d){if(!d||d.version!==1||!Array.isArray(d.cars)||!Array.isArray(d.tasks)||!d.settings||!Number.isFinite(d.settings.days)||!Number.isFinite(d.settings.km))throw Error('invalid');let ids=new Set();for(let c of d.cars){if(!c||typeof c.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(c.id)||ids.has(c.id)||typeof c.name!=='string'||!c.docs||!c.service||!c.tires)throw Error('inval toast('لا توجد تواريخ مسجلة للتصدير');return}lines.push('END:VCALENDAR');downloadBlob(new Blob([lines.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}),'Sayyarati_Reminders.ics');toast('افتح الملف في التقويم وأضف المواعيد')}reconcileSavedOdo(data);render();persist();let renderedDay=today();function refreshDay(){if(today()!==renderedDay&&!$('modal').open){renderedDay=today();render()}}document.addEventListener('visibilitychange',refreshDay);window.addEventListener('focus',refreshDay);setInterval(refreshDay,60000);
